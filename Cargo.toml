[package]
name = "octoii-siphon-lib"
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Safe Rust interface to Siphon's native execution library"
repository = "https://github.com/octoii-works/octoii-siphon-lib"
links = "siphon_native"
include = ["/Cargo.toml", "/Cargo.lock", "/LICENSE", "/README.md", "/artifacts.json", "/build.rs", "/include/siphon.h", "/src/"]

[dependencies]
anyhow = "1.0.104"
bytes = "1.12.1"
futures-util = { version = "0.3.34", default-features = false, features = ["std"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
tokio = { version = "1.54.1", features = ["rt", "sync"] }
tokio-util = "0.7.20"

[build-dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros", "time"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace]
resolver = "3"
