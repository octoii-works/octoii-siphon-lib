[package]
name = "octoii-siphon-lib"
version = "0.0.1"
edition = "2024"
rust-version = "1.100"
license = "MIT"
description = "Safe Rust interface to Siphon's native execution library"
repository = "https://github.com/octoii-works/octoii-siphon-lib"
links = "siphon_native"
publish = false

[build-dependencies]
serde_json = "1.0.154"
sha2 = "0.11.1"

[dev-dependencies]
tempfile = "3.27.0"
tokio = { version = "1.54.1", features = ["rt-multi-thread", "macros"] }

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"
